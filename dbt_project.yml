# thelook-analytics-dbt
# BigQuery の公開データ thelook_ecommerce を使った、dbt のポートフォリオ用プロジェクトです。
# モデルの構成は、staging（元データを1テーブルずつ整える）と marts（分析用の完成形）の2層です。

name: 'thelook_analytics_dbt'
version: '1.0.0'
config-version: 2

# dbt Cloud では、接続は画面側で設定するため、この値は使われません。
profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# モデルの作り方（ビューかテーブルか、など）は、既定の「ビュー」を使います。
# テーブルにするのは fct_order_items だけで、その設定は、モデルのファイル先頭の config に書いています。
